<!DOCTYPE html>
<html lang="en">
<head>
  <script src="script/account.js"></script>
  <script>try{if(sessionStorage.getItem("currentUser")||sessionStorage.getItem("activeUser")||localStorage.getItem("currentUser"))document.documentElement.classList.add("logged-in")}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quackbit | Story Journey & Challenges</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Acme&family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=optional" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=optional">
  <link rel="stylesheet" href="css/story-hub.css">
  <link rel="icon" type="image/x-icon" href="./assets/images/face.png">
</head>
<body>
  <audio id="bg-music" loop>
    <source src="./assets/music/bg-music-courses.mp3" type="audio/mpeg">
  </audio>
  <header class="header">
    <div class="logo">
      <a href="index.html">
        <img src="./assets/images/logo.png" alt="QuackBit Logo" class="logo-img" width="91" height="34">
      </a>
    </div>

    <div class="header-right">
      <nav class="navbar" id="main-navbar">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="story.html">Courses</a></li>
          <li class="nav-auth-only" hidden><a href="history.html">My Code</a></li>
          <li><a href="team.html">About Us</a></li>
          <li class="nav-item-has-children user-profile-nav" hidden>
            <button type="button" class="submenu-toggle" aria-expanded="false">
              <span>Profile</span>
              <span class="chevron-icon">▼</span>
            </button>
            <ul class="child-menu" hidden>
              <li><a href="stats.html">Stats</a></li>
              <li><a href="handbook.html">Guidebook</a></li>
              <li><button type="button" class="logout-btn">Lock Out</button></li>
            </ul>
          </li>
        </ul>
        <div class="auth-buttons">
          <a href="login.html" class="login-text">Lock In!</a>
        </div>
      </nav>
      <button type="button" class="hamburger" id="hamburger-btn" aria-label="Toggle Navigation" aria-expanded="false">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
    </div>
  </header>
  <script>QuackbitAccount.renderHeader();</script>

  <main class="story-hub-main">
    <section class="story-hub-hero">
      <div class="wood"></div>
      <h1>Choose Your Story</h1>
      <p>
        The 10 perilous Guardian trials and the battle of the great serpent PyThorn!
      </p>

      <div class="progress-tracker-card">
        <div class="progress-info">
          <span class="progress-label">My Progress</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-bar-fill" class="progress-bar-fill" style="width: 6%;"></div>
        </div>
        <div class="progress-info">
          <span id="progress-count" class="progress-count">1 / 16 Unlocked (6%)</span>
        </div>
      </div>
    </section>

    <nav class="story-filter-nav" aria-label="Story categories">
      <button type="button" class="filter-btn active" data-category="all">
        🗺️ All Stories (16)
      </button>
      <button type="button" class="filter-btn" data-category="village">
        🏡 Village Training (5)
      </button>
      <button type="button" class="filter-btn" data-category="guardian">
        ⚔️ Guardian Trials (10)
      </button>
      <button type="button" class="filter-btn" data-category="boss">
        🔥 Final Boss (1)
      </button>
    </nav>

    <section id="story-grid" class="story-grid" aria-live="polite">
    </section>
  </main>

  <script src="script/stories-data.js"></script>
  <script src="script/story-hub.js"></script>
  <script src="script/tour.js"></script>
</body>
</html>
