<!DOCTYPE html>
<html lang="en">
<head>
  <script src="script/site-boot.js"></script>
  <script src="script/account.js"></script>
  <script>try{if(sessionStorage.getItem("currentUser")||sessionStorage.getItem("activeUser")||localStorage.getItem("currentUser"))document.documentElement.classList.add("logged-in")}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Acme&family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/register.css">
  <link rel="stylesheet" href="css/site-loader.css">
  <link rel="icon" type="image/x-icon" href="assets/images/face.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/site-mobile.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <a href="index.html">
        <img src="assets/images/logo.png" alt="QuackBit Logo" class="logo-img" width="91" height="34">
      </a>
    </div>
    <nav class="navbar" id="nav-logged-out">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="story.html">Courses</a></li>
        <li class="nav-auth-only" hidden><a href="history.html">My Code</a></li>
        <li><a href="team.html">About Us</a></li>
      </ul>
      <div class="auth-buttons">
        <a href="login.html" class="login-text">Lock In!</a>
      </div>
    </nav>
  </header>
  <main>
    <section>
      <h1>Sign Up to Our Learning Platform</h1>

      <div id="error-box" class="error-notice"></div>

      <form id="register-form" action="register.html" method="POST">
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirm-password">Re-enter Password:</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn">Create Account</button>
      </form>
    </section>
  </main>
  <script src="script/register.js"></script>
</body>
</html>
